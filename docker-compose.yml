services:
  db-imperium:
    image: postgres:16-alpine
    container_name: imperium_database
    env_file:
      - .env
    volumes:
      - postgres_imperium_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - software-rural-network

  backend-imperium:
    container_name: backend-imperium
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db-imperium:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - software-rural-network

  frontend-imperium:
    container_name: frontend-imperium
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
        REACT_APP_TURNSTILE_SITE_KEY: ${REACT_APP_TURNSTILE_SITE_KEY}
    depends_on:
      - backend-imperium
    restart: unless-stopped
    networks:
      - software-rural-network

  migrations-imperium:
    container_name: migrations-imperium
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    env_file:
     - .env
    command: /root/.dotnet/tools/dotnet-ef database update
    depends_on:
      db-imperium:
        condition: service_healthy
    restart: "no"
    networks:
      - software-rural-network

networks:
  software-rural-network:
    external: true

volumes:
  postgres_imperium_data:
    driver: local