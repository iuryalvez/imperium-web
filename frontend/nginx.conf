server {
    listen 80;
    server_name localhost;

    # Localização dos arquivos estáticos do React
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuração para SPA (React Router)
    # Tenta encontrar o arquivo $uri, depois $uri/ (diretório),
    # se falhar, redireciona para /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API
    # Todas as requisições /api/* serão enviadas para o serviço 'api' na porta 8080
    location /api/ {
        # 'api' é o nome do serviço backend no docker-compose.yml
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configurações para WebSockets (se sua API usar SignalR, etc.)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Ocultar a versão do Nginx nos cabeçalhos de erro
    server_tokens off;
}