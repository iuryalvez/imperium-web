worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server {
        listen 80; 

        # Cabeçalhos de segurança, enviados em todas as respostas (inclusive erros).
        # HSTS: o navegador passa a acessar o site só por HTTPS (é ignorado em http://localhost).
        add_header Strict-Transport-Security "max-age=31536000" always;
        # O navegador respeita o tipo do arquivo informado pelo servidor.
        add_header X-Content-Type-Options "nosniff" always;
        # O sistema não pode ser aberto dentro de um iframe de outro site (clickjacking).
        add_header X-Frame-Options "DENY" always;
        # Ao sair para outro site, o navegador envia só o domínio, nunca o caminho ou a query
        # (o link de redefinição de senha leva o token na URL).
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html; # React Router
        }
    }
}
